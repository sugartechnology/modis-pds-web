server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.dc.html;

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(jpg|jpeg|png|webp|svg|mp4|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
